<style>

<body class="min-h-screen flex items-center justify-center font-sans relative overflow-hidden hospital-pattern">
<!-- Background Vignette/Gradient overlay for depth -->
<div class="absolute inset-0 bg-radial-gradient from-transparent via-[#020617]/50 to-[#020617] pointer-events-none"></div>
<!-- Main Content Canvas (Login Card) -->
<div class="relative z-10 w-full max-w-md px-container-margin md:px-0">
<div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl p-section-gap flex flex-col gap-6">
<!-- Brand Header -->
<div class="flex flex-col items-center gap-4">
<img alt="CarePoint Hospital Logo" class="w-16 h-16 rounded-md object-contain shadow-sm border border-slate-800" src="https://lh3.googleusercontent.com/aida/AP1WRLvu1QQixptawza1pqSgTBM7811io88LQaMAMP_v0ZafTjDLxQMOOdQkGR2PBFSEWgd4Y4uSUti98sN0XN4KN0gOaxdiqV_VG6NbfD6ey9lbBC4qDORmhg7xpK_jbLX0L10rTlfhZkSGnyVW7CgPFSfQLh1-pW9vKQjo7m718jb5bk-W5WNQqt85A4EHat5JwV5Ia3gP-540OG_Wc1CrZMb5kV7LH2bMdPGyiKEHjNkvWEQTqmr_4uWECUs8"/>
<h1 class="font-headline-md text-headline-md font-bold text-primary">CarePoint Hospital</h1>
<h2 class="font-headline-sm text-headline-sm text-slate-100 text-center mt-2">Welcome back</h2>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-5 mt-2">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-slate-300" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" style="font-size: 20px;">mail</span>
<input class="w-full input-clinical rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md transition-all duration-200" id="email" placeholder="dr.smith@carepoint.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm text-slate-300" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none" style="font-size: 20px;">lock</span>
<input class="w-full input-clinical rounded-lg pl-10 pr-10 py-3 font-body-md text-body-md transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 focus:outline-none transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full btn-primary font-headline-sm text-body-md rounded-lg py-3 mt-4 shadow-lg shadow-primary-container/20 flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2 opacity-50">
<div class="h-px bg-slate-800 flex-1"></div>
<span class="font-body-sm text-body-sm text-slate-400 uppercase tracking-widest">or</span>
<div class="h-px bg-slate-800 flex-1"></div>
</div>
<!-- Sign Up Link -->
<div class="text-center font-body-sm text-body-sm">
<span class="text-slate-400">New staff member? </span>
<a class="text-primary hover:text-primary-container font-medium transition-colors" href="#">Create an account</a>
</div>
<!-- Context Note -->
<div class="mt-4 p-4 bg-[#020617] rounded-lg border border-slate-800/50 flex items-start gap-3">
<span class="material-symbols-outlined text-slate-500 mt-0.5" style="font-size: 18px;">info</span>
<p class="font-body-sm text-body-sm text-slate-500 leading-relaxed">
                    Role-based access — your dashboard loads automatically after login based on your clinical privileges.
                </p>
</div>
<!-- Date/Time Display (Requirement check) -->
<div class="text-center mt-2">
<p class="font-data-mono text-data-mono text-slate-500/50" id="current-time">24 OCT 2023 | 10:45 AM</p>
</div>
</div>
</div>
<script>
        // Simple password toggle visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
        
        // Update time to DD MMM YYYY and 12-hour IST format (mocked statically for now, could be dynamic)
        function updateTime() {
            const now = new Date();
            const options = { 
                timeZone: 'Asia/Kolkata', 
                day: '2-digit', 
                month: 'short', 
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            };
            const timeString = now.toLocaleString('en-IN', options).toUpperCase().replace(',', ' |');
            document.getElementById('current-time').textContent = timeString;
        }
        
        // Initialize time
        updateTime();
        // setInterval(updateTime, 60000); // Optional: keep time updated
    </script>
